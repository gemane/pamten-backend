services:
  - type: web
    name: ownership-platform-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ARCADEDB_URL
        sync: false
      - key: ARCADEDB_USERNAME
        sync: false
      - key: ARCADEDB_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        # The owlgraph.org domains are canonical. Keep the frontend and API on one
        # registrable domain: dev.owlgraph.org / api-dev.owlgraph.org are same-site,
        # which is what lets an httpOnly SameSite=Lax auth cookie work between them
        # (the *.onrender.com pair are separate sites — onrender.com is on the
        # Public Suffix List — so a cookie between them would be third-party).
        value: https://dev.owlgraph.org
