[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    integration: needs a real ArcadeDB; skipped unless ARCADEDB_IT_URL is set (see tests/integration/README.md)
    allow_network: this test genuinely makes an outbound request; every other test is blocked from reaching anything but the database (see tests/conftest.py)
    allow_db: a unit test that deliberately sends a request to the database; every other test outside tests/integration fails if it does (findings item 52, tests/conftest.py)
